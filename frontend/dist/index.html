<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kestrel — Company Brain</title>
    <script>
      // A deploy replaces the hashed bundle and deletes the previous one, so a tab
      // that still holds the old index.html asks for files that no longer exist.
      // The browser answers with 404, React never mounts, and the user gets a BLANK
      // PAGE with nothing on it to explain itself — measured, not theorised: this is
      // exactly how the live app presented itself after a rebuild.
      // Reload so the tab picks up the new manifest. If reloading does not fix it,
      // say so out loud instead of looping.
      //
      // The retry allowance is a TIMESTAMP, not a once-per-session flag. The first
      // version stored "1", and that turned a 3-second server restart into a screen
      // the owner could not escape: the tab failed during the downtime, burned its
      // single reload, and then pinned "could not load its interface" over a fully
      // healthy server until the tab was closed. A cooldown still prevents a reload
      // loop, but it lets a transient failure heal itself.
      (function () {
        var KEY = "kestrel.bundle.retry";
        var COOLDOWN_MS = 20000;
        function last() {
          try { return parseInt(sessionStorage.getItem(KEY) || "0", 10) || 0; } catch (e) { return 0; }
        }
        function explain() {
          if (document.getElementById("stale-bundle")) return;
          var box = document.createElement("div");
          box.id = "stale-bundle";
          box.setAttribute("role", "alert");
          box.style.cssText = "position:fixed;inset:0;display:grid;place-items:center;" +
            "padding:24px;font:15px/1.6 ui-sans-serif,system-ui,sans-serif;color:#EDEBE7;" +
            "background:#141413;text-align:center";
          box.innerHTML = '<div><p style="margin:0 0 14px;font-size:17px">' +
            "Kestrel could not load its interface.</p>" +
            '<button type="button" id="stale-reload" style="font:inherit;padding:10px 18px;' +
            "border:1px solid #45413A;border-radius:8px;background:#1D1C1A;color:inherit;" +
            'cursor:pointer">Reload the page</button>' +
            '<p style="margin:12px 0 0;font-size:12.5px;opacity:.7">This one retries from ' +
            'scratch, so it works even if the server was restarting.</p></div>';
          document.body.appendChild(box);
          // Clear the allowance first: a deliberate click must take the full retry
          // path, not find itself blocked by the automatic attempt that just failed.
          document.getElementById("stale-reload").onclick = function () {
            try { sessionStorage.removeItem(KEY); } catch (e) {}
            location.reload();
          };
        }
        function failed() {
          var age = Date.now() - last();
          if (age < COOLDOWN_MS) { explain(); return; }
          try { sessionStorage.setItem(KEY, String(Date.now())); } catch (e) {}
          location.reload();
        }
        // A SCRIPT element fires `error` for two unrelated reasons. Either the file is
        // genuinely gone — a deploy replaced the hashed bundle under this tab — or the
        // request was merely ABORTED by a navigation, which is exactly what Clerk's
        // `?__clerk_handshake=` redirect does on every signed-in load. The first
        // version treated both as "stale bundle" and cried wolf: the log showed
        // index-*.js served with 200, React mounted and set the title, and the tab
        // still landed on the failure panel because the guard reloaded it mid-flight.
        //
        // Evidence comes from asking the server, not from timing data:
        // `PerformanceResourceTiming.responseStatus` is Chrome-only — measured absent in
        // WebKit 26.0 — so relying on it would silently disable recovery in Safari while
        // looking correct in Chrome. A same-origin GET returns a real status in every
        // engine, and it only runs after a script error, so the cost is one extra request
        // on a page that is already broken.
        function isMissing(url) {
          var abs;
          try { abs = new URL(url, location.href).href; } catch (e) { return Promise.resolve(false); }
          if (abs.indexOf(location.origin) !== 0) return Promise.resolve(false);
          return fetch(abs, {method: "GET", cache: "no-store", credentials: "same-origin"})
            .then(function (r) { return r.status >= 400; },
                  function () { return false; });   // unreachable is not "stale"
        }
        // Resource errors do not bubble; capture them at the window instead.
        window.addEventListener("error", function (e) {
          var t = e.target;
          if (!t || t.tagName !== "SCRIPT" || !/\.js(\?|$)/.test(t.src || "")) return;
          // Defer one task: the request has to finish failing before it can be asked.
          setTimeout(function () {
            isMissing(t.src).then(function (gone) { if (gone) failed(); });
          }, 0);
        }, true);
        window.addEventListener("vite:preloadError", function (e) {
          e.preventDefault();
          // A rejected dynamic import is the classic stale-deploy signal, but it also
          // fires when a navigation aborts the chunk mid-flight — measured: an aborted
          // bundle spent a reload through THIS branch after the error listener was made
          // evidence-based. Same rule applies: name a URL, ask the server, reload only
          // on a real 4xx/5xx. With no URL to check, say nothing and let the empty-root
          // tick decide, because an unproven reload is the bug this whole block exists
          // to remove.
          var msg = String((e.error && (e.error.message || e.error)) || "");
          var m = msg.match(/\/assets\/[A-Za-z0-9._-]+\.js/);
          if (m) {
            isMissing(m[0]).then(function (gone) { if (gone) failed(); });
          }
        }, true);
        window.addEventListener("load", function () {
          var tries = 0;
          var tick = function () {
            var root = document.getElementById("root");
            if (root && root.children.length) {
              // Mounted: forget the retry, so the next genuine failure gets a fresh
              // attempt instead of inheriting this one.
              try { sessionStorage.removeItem(KEY); } catch (e) {}
              return;
            }
            // A hidden tab is timer-throttled; React may simply not have run yet.
            // Reloading it would have the guard manufacture the outage it reports.
            // But this branch used to RETURN — before ++tries and before re-arming —
            // so a tab first opened in the background (any ⌘-click) was never watched
            // again: the user arrived to a blank page with neither a reload nor the
            // explanation panel, until they reloaded by hand. Keep watching a hidden
            // tab at a slower budget instead of going dark; the cost is a timer, the
            // alternative is a silent dead end exactly where the guard matters most.
            if (document.hidden) { if (++tries < 24) setTimeout(tick, 2500); return; }
            if (++tries < 4) { setTimeout(tick, 2500); return; }
            // Still empty after ~10s in a visible tab. Reload ONLY if a bundle request
            // actually came back 4xx/5xx. The await matters: `.some(s => isMissing(...))`
            // returned a Promise, and a Promise is always truthy — so every visible tab
            // with a slow mount spent a reload, and the explain-without-reloading branch
            // below was dead code. The WebKit gate caught it as an abort that still wrote
            // a retry stamp.
            var srcs = [].slice.call(document.querySelectorAll("script[src]")).map(function (s) {
              return isMissing(s.src);
            });
            Promise.all(srcs).then(function (verdicts) {
              if (verdicts.some(Boolean)) { failed(); } else { explain(); }
            });
          };
          setTimeout(tick, 2500);
        });
      })();
    </script>

    <div id="root"></div>
