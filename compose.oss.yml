# Local OSS Cognee — BUILD_PLAN.md M0.2.
#
# Gitignored on purpose: local debugging may paste real keys into .env.oss and
# this file may grow local-only tweaks. .env.oss.example is the tracked
# template; recreate this file from it on a fresh clone:
#
#   cp .env.oss.example .env.oss
#   docker compose -f compose.oss.yml up -d
#   curl -s localhost:8888/health
#
# Port 8888 on the host so the OSS server can never be confused with our app
# tier on 8000. The image is pinned EXACTLY — never latest, never a floating
# minor tag (BUILD_PLAN.md N4: upstream ships ~2 releases/month, breaking).
#
# The named volume keeps embedded stores (SQLite/LanceDB/Kuzu) across container
# recreation, so the hours-long free-tier ingest in M1.2 survives a rebuild.
# Externalized state (Neon) arrives in Phase 2 and replaces this.
# M2.2 correction: ONLY mounted paths survive. The image keeps live data under
# /cognee-storage (DATA/SYSTEM_ROOT_DIRECTORY), NOT under /app/.cognee (logs +
# ids only) — a --force-recreate with only the .cognee mount wiped the demo
# graph on 28 Sep 2026 (rebuilt after). Both paths are mounted now.

services:
  cognee-oss:
    image: cognee/cognee:1.6.1
    container_name: cognee-oss
    restart: unless-stopped
    ports:
      - "8888:8000"
    env_file:
      - .env.oss
    volumes:
      - cognee_oss_state:/app/.cognee
      - cognee_oss_data:/cognee-storage
    # O2: without this, a host reboot starts the app before Postgres is
    # ready, and the app's one-shot storage.init degrades it for its whole
    # lifetime (now also self-heals via retry — belt and suspenders).

  postgres:
    image: postgres:17-alpine
    container_name: kestrel-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: kestrel
      POSTGRES_PASSWORD: kestrel
      POSTGRES_DB: kestrel
    ports:
      - "5433:5432"
    volumes:
      - kestrel_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kestrel -d kestrel"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # P5 observability: local Langfuse (v2 — Postgres-only, no ClickHouse).
  # Traces land at http://localhost:3000; the app posts to it when
  # LANGFUSE_* keys are present in .env (no keys = the bridge is a no-op,
  # so this service is optional).
  langfuse:
    image: langfuse/langfuse:2
    container_name: kestrel-langfuse
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://kestrel:${POSTGRES_PASSWORD:-kestrel}@kestrel-db:5432/langfuse
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:-kestrel-local-secret}
      SALT: ${LANGFUSE_SALT:-kestrel-local-salt}
      TELEMETRY_ENABLED: "false"
      LANGFUSE_INIT_ORGANIZATION_NAME: ${LANGFUSE_INIT_ORGANIZATION_NAME:-Kestrel}
      LANGFUSE_INIT_PROJECT_NAME: ${LANGFUSE_INIT_PROJECT_NAME:-kestrel-local}
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_INIT_PROJECT_PUBLIC_KEY:-pk-lf-local}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_INIT_PROJECT_SECRET_KEY:-sk-lf-local}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL:-ayush@kestrel.local}
      LANGFUSE_INIT_USER_NAME: ${LANGFUSE_INIT_USER_NAME:-Ayush}
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD:-kestrel-local-demo}
    depends_on:
      - postgres


volumes:
  cognee_oss_state:
  cognee_oss_data:
  kestrel_db:
