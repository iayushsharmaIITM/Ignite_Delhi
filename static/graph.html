<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kestrel Company Brain — Graph</title>
<style>
* { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); overflow:hidden;
         font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
  canvas { display:block; width:100vw; height:100vh; cursor:grab; }
  /* Focus layer: transparent, on top, ignores the pointer so clicks still reach
     the graph underneath. */
  #c2 { position:absolute; inset:0; pointer-events:none; z-index:2; }
  canvas:active { cursor:grabbing; }

  .hud { position:fixed; top:20px; left:22px; pointer-events:none; }
  .hud h1 { font-size:17px; font-weight:650; margin:0 0 4px; }
  .hud p { margin:0; color:var(--muted); font-size:13px; }

  .panel { position:fixed; bottom:20px; left:22px; padding:11px 15px;
           background:rgba(23,26,33,.92); border:1px solid var(--line);
           border-radius:10px; font-size:12.5px; color:var(--muted);
           display:flex; gap:16px; align-items:center; backdrop-filter:blur(8px); }
  .panel b { color:var(--fg); font-weight:600; }

  .legend { position:fixed; top:20px; right:22px; padding:11px 15px;
            background:rgba(23,26,33,.92); border:1px solid var(--line);
            border-radius:10px; font-size:12.5px; backdrop-filter:blur(8px);
            max-height:70vh; overflow:auto; }
  .legend div { display:flex; align-items:center; gap:8px; margin:3px 0;
                color:var(--muted); }
  .swatch { width:9px; height:9px; border-radius:50%; flex:none; }

  a.back { position:fixed; top:20px; right:22px; color:var(--fg);
           text-decoration:none; font-size:13px; }
  .err { position:fixed; inset:0; display:flex; align-items:center;
         justify-content:center; color:#f27a7a; font-size:15px; text-align:center;
         padding:40px; }
</style>
<link rel="stylesheet" href="/static/shell.css">
<style>
  /* The graph is full-bleed, so it makes room for the shared sidebar itself. */
  @media (min-width: 821px) {
    canvas { width: calc(100vw - var(--sb-w)); margin-left: var(--sb-w); }
    .hud, .panel { left: calc(var(--sb-w) + 22px); }
    .err { left: var(--sb-w); }
  }

  /* Node inspector. Clicking a node is the whole point of an explorable graph:
     the picture alone shows structure, but the node holds the data. */
  #detail {
    position: fixed; top: 0; right: 0; bottom: 0; width: 340px; z-index: 30;
    background: var(--panel); border-left: 1px solid var(--line);
    padding: 18px 18px 26px; overflow-y: auto;
    transform: translateX(100%); transition: transform .18s ease;
    box-shadow: -8px 0 28px rgba(0,0,0,.35);
  }
  #detail.open { transform: none; }
  #detail .close {
    position: absolute; top: 12px; right: 14px; width: 28px; height: 28px;
    border-radius: 8px; border: 1px solid var(--line); background: var(--panel-2);
    color: var(--muted); cursor: pointer; font-size: 15px; line-height: 1;
  }
  #detail .close:hover { color: var(--fg); border-color: var(--line-2); }
  #detail .kind {
    display: inline-block; font-size: 10.5px; font-weight: 700; letter-spacing: .09em;
    text-transform: uppercase; color: var(--accent); margin-bottom: 8px;
  }
  #detail h2 {
    font-size: 17px; font-weight: 650; margin: 0 26px 14px 0;
    line-height: 1.35; word-break: break-word;
  }
  #detail .sect {
    font-size: 10.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
    color: var(--muted-2); margin: 18px 0 8px;
  }
  #detail .rel { display: flex; flex-direction: column; gap: 6px; }
  #detail .rel .row {
    display: flex; align-items: baseline; gap: 7px; font-size: 13px;
    padding: 7px 10px; border-radius: 8px; background: var(--panel-2);
    border: 1px solid var(--line); cursor: pointer;
  }
  #detail .rel .row:hover { border-color: var(--accent-dim); }
  #detail .rel .arrow { color: var(--accent); font-size: 11px; flex: none; }
  #detail .rel .verb {
    color: var(--muted); font-size: 11.5px; flex: none;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  #detail .rel .who { color: var(--fg); word-break: break-word; }
  #detail .props { display: flex; flex-direction: column; gap: 5px; font-size: 12.5px; }
  #detail .props .p { display: flex; gap: 8px; }
  #detail .props .k { color: var(--muted-2); flex: none; min-width: 92px; }
  #detail .props .v { color: var(--fg); word-break: break-word; }
  #detail .hint { color: var(--muted-2); font-size: 12.5px; }

  /* Zoom / reset controls, bottom-right. */
  /* Exit control: the way back out of an expanded node. Deliberately large and
     labelled - an unlabelled glyph was not discoverable. */
  #exit-zoom {
    position: fixed; right: 22px; bottom: 74px; z-index: 32;
    display: inline-flex; align-items: center; gap: 8px;
    padding: 11px 18px; border-radius: 999px;
    border: 1px solid var(--line-3); background: var(--panel-2); color: var(--fg);
    font: inherit; font-size: 13.5px; font-weight: 600; cursor: pointer;
    box-shadow: var(--shadow);
  }
  #exit-zoom:hover { background: var(--panel-3); border-color: var(--fg); }
  #exit-zoom .x { font-size: 15px; line-height: 1; color: var(--muted); }
  #exit-zoom[hidden] { display: none; }
  #detail.open ~ #exit-zoom { right: 362px; }

  .zoom { position: fixed; right: 22px; bottom: 20px; z-index: 31; display: flex; gap: 6px; }
  .zoom button {
    width: 34px; height: 34px; border-radius: 9px; border: 1px solid var(--line);
    background: var(--panel); color: var(--fg); cursor: pointer; font-size: 15px;
  }
  .zoom button:hover { border-color: var(--accent-dim); }
  #detail.open ~ .zoom { right: 362px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<canvas id="c2"></canvas>

<div class="hud">
  <h1 id="title">Knowledge graph</h1>
  <p id="subtitle">Every entity and relationship extracted from the company corpus.</p>
</div>

<div class="panel" id="panel">loading…</div>
<div class="legend" id="legend"></div>

<aside id="detail" aria-live="polite">
  <button class="close" id="detail-close" type="button" aria-label="Close">×</button>
  <div class="kind" id="d-kind"></div>
  <h2 id="d-label"></h2>
  <div id="d-body"></div>
</aside>

<button id="exit-zoom" type="button" hidden>
  <span class="x">×</span> Exit node view
</button>

<div class="zoom">
  <button id="z-in"  type="button" title="Zoom in">+</button>
  <button id="z-out" type="button" title="Zoom out">−</button>
  <button id="z-fit" type="button" title="Reset view">⤢</button>
  <button id="x-all" type="button" title="Expand everything">⊕</button>
  <button id="x-none" type="button" title="Collapse to core nodes">⊖</button>
</div>

<script>
// Colour by node type so the graph reads as structure, not spaghetti.
const PALETTE = ['#f2f3f5','#c9ccd3','#9aa0aa','#7b8089','#dfe1e6',
                 '#aab0b9','#6b7078','#b9bcc4','#8b8f98','#5c6068'];
const typeColor = {};
function colorFor(type) {
  if (!(type in typeColor)) {
    typeColor[type] = PALETTE[Object.keys(typeColor).length % PALETTE.length];
  }
  return typeColor[type];
}

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const canvas2 = document.getElementById('c2');
const ctx2 = canvas2.getContext('2d');
let W, H, DPR;
function resize() {
  DPR = window.devicePixelRatio || 1;
  W = canvas.clientWidth; H = canvas.clientHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
  canvas2.width = W * DPR; canvas2.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx2.setTransform(DPR, 0, 0, DPR, 0, 0);
}
resize();
window.addEventListener('resize', resize);

let nodes = [], edges = [], byId = {};
let cam = { x: 0, y: 0, k: 1 };
// Declared here, not next to the click handlers: draw() reads it on the very
// first frame, which can run before the interaction block is reached.
let selected = null;

// --- progressive disclosure ------------------------------------------------
// The graph opens as a handful of CORE nodes rather than all 219 at once.
// Clicking a core node reveals its sub-nodes; clicking again hides them. A wall
// of 219 nodes and 500 edges is impressive for a second and unreadable after
// that - this makes the structure explorable instead.
let ROOTS = [];                      // the core nodes shown at rest
const expanded = new Set();          // ids whose sub-nodes are currently shown
let visibleIds = new Set();          // computed each frame

function visibleNodes() {
  const out = new Set(ROOTS);
  for (const id of expanded) {
    out.add(id);
    for (const nb of neighboursOf(id)) out.add(nb);
  }
  return out;
}

// A camera target the frame loop eases toward. Expanding a node flies the view
// to that node and its sub-nodes; collapsing flies back out to the core set.
// Without the easing the view snaps, which reads as a jump rather than a zoom.
let camTarget = null;

function fitTo(ids, pad, maxK) {
  pad = pad || 110;
  maxK = maxK || 1.5;
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity, any = false;
  for (const id of ids) {
    const nd = byId[id];
    if (!nd) continue;
    any = true;
    minX = Math.min(minX, nd.x); maxX = Math.max(maxX, nd.x);
    minY = Math.min(minY, nd.y); maxY = Math.max(maxY, nd.y);
  }
  if (!any) return;
  const w = Math.max(maxX - minX, 1), h = Math.max(maxY - minY, 1);
  // Clamped so a single node does not fill the screen and a wide set does not
  // shrink to a dot - "not too congested, not too far away".
  const k = Math.min(maxK, Math.max(0.3, Math.min((W - pad * 2) / w, (H - pad * 2) / h)));
  camTarget = { k, x: W / 2 - ((minX + maxX) / 2) * k, y: H / 2 - ((minY + maxY) / 2) * k };
  wake();
}

function easeCam() {
  if (!camTarget) return false;
  const t = 0.16;
  cam.x += (camTarget.x - cam.x) * t;
  cam.y += (camTarget.y - cam.y) * t;
  cam.k += (camTarget.k - cam.k) * t;
  if (Math.abs(camTarget.x - cam.x) < 0.6 &&
      Math.abs(camTarget.y - cam.y) < 0.6 &&
      Math.abs(camTarget.k - cam.k) < 0.002) {
    cam = { x: camTarget.x, y: camTarget.y, k: camTarget.k };
    camTarget = null;
    return false;
  }
  return true;
}

function expandAll() {
  for (const nd of nodes) expanded.add(nd.id);
  syncExit();
  fitTo(nodes.map(nd => nd.id), 60);
  render();
}

function collapseAll() {
  expanded.clear();
  selected = null;
  document.getElementById('detail').classList.remove('open');
  syncExit();                       // hides the exit control again
  fitTo(ROOTS, 110, 1.0);           // never closer than the opening view
  render();
}

// --- force simulation (small, dependency-free) ---------------------------
function simulate(alpha) {
  const cx = W / 2, cy = H / 2;
  for (const n of nodes) {
    n.vx = (n.vx || 0) * 0.86;
    n.vy = (n.vy || 0) * 0.86;
    // centring
    n.vx += (cx - n.x) * 0.0009 * alpha;
    n.vy += (cy - n.y) * 0.0009 * alpha;
  }
  // repulsion
  for (let i = 0; i < nodes.length; i++) {
    for (let j = i + 1; j < nodes.length; j++) {
      const a = nodes[i], b = nodes[j];
      let dx = b.x - a.x, dy = b.y - a.y;
      let d2 = dx * dx + dy * dy || 1;
      if (d2 > 160000) continue;
      const f = 1500 / d2;
      const d = Math.sqrt(d2);
      dx /= d; dy /= d;
      a.vx -= dx * f * alpha; a.vy -= dy * f * alpha;
      b.vx += dx * f * alpha; b.vy += dy * f * alpha;
    }
  }
  // springs
  for (const e of edges) {
    const a = byId[e.source], b = byId[e.target];
    if (!a || !b) continue;
    const dx = b.x - a.x, dy = b.y - a.y;
    const d = Math.sqrt(dx * dx + dy * dy) || 1;
    const f = (d - 135) * 0.012 * alpha;
    const ux = dx / d, uy = dy / d;
    a.vx += ux * f; a.vy += uy * f;
    b.vx -= ux * f; b.vy -= uy * f;
  }
  for (const n of nodes) { n.x += n.vx; n.y += n.vy; }
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  ctx2.clearRect(0, 0, W, H);

  visibleIds = visibleNodes();

  const focus = selected ? neighboursOf(selected) : null;
  const blurring = !!(focus && focus.size > 1);
  const isFocused = id => !focus || focus.has(id);

  // Focused: the background nodes are removed entirely and replaced by a black
  // gradient that falls off from the focused node. Blurring them still left them
  // competing for attention; hiding them makes the sub-nodes the only thing on
  // screen. The gradient keeps it from being a flat black rectangle.
  if (blurring) {
    const sel = byId[selected];
    const cx = cam.x + sel.x * cam.k;
    const cy = cam.y + sel.y * cam.k;
    const radius = Math.max(W, H) * 0.66;
    const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, radius);
    grad.addColorStop(0, '#15171d');     // faint lift behind the subject
    grad.addColorStop(0.5, '#0a0b0e');
    grad.addColorStop(1, '#000000');     // fades to true black at the edges
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    drawLayer(ctx2, id => isFocused(id));
  } else {
    drawLayer(ctx, () => true);
  }
}

// Draws the visible subset matching `wanted` onto the given context.
function drawLayer(target, wanted) {
  target.save();
  target.translate(cam.x, cam.y);
  target.scale(cam.k, cam.k);

  target.globalAlpha = 1;
  target.strokeStyle = 'rgba(255,255,255,.6)';
  target.lineWidth = 1.7 / cam.k;
  for (const e of edges) {
    if (!visibleIds.has(e.source) || !visibleIds.has(e.target)) continue;
    if (!(wanted(e.source) || wanted(e.target))) continue;
    const a = byId[e.source], b = byId[e.target];
    if (!a || !b) continue;
    target.beginPath(); target.moveTo(a.x, a.y); target.lineTo(b.x, b.y); target.stroke();
  }

  for (const nd of nodes) {
    if (!visibleIds.has(nd.id) || !wanted(nd.id)) continue;
    const isSel = nd.id === selected;
    target.beginPath();
    target.arc(nd.x, nd.y, isSel ? nd.r * 1.7 : nd.r, 0, Math.PI * 2);
    target.fillStyle = colorFor(nd.type);
    target.fill();
    if (isSel) {
      target.strokeStyle = '#fff';
      target.lineWidth = 2 / cam.k;
      target.stroke();
    }
  }

  target.font = '11px -apple-system,sans-serif';
  target.textAlign = 'center';
  for (const nd of nodes) {
    if (!visibleIds.has(nd.id) || !wanted(nd.id)) continue;
    const isSel = nd.id === selected;
    if (!isSel && cam.k <= 0.85) continue;
    if (nd.label.length > 34) continue;
    target.fillStyle = isSel ? '#ffffff' : '#c9ccd3';
    target.fillText(nd.label, nd.x, nd.y - nd.r - 5);
  }

  target.restore();
}

function neighboursOf(id) {
  const out = new Set([id]);
  for (const e of edges) {
    if (e.source === id) out.add(e.target);
    else if (e.target === id) out.add(e.source);
  }
  return out;
}

// The layout settles, so the render loop must too. Previously tick() re-armed
// requestAnimationFrame unconditionally, redrawing an unchanging picture 60
// times a second for as long as the tab stayed open.
let alpha = 1, running = false;

function frame() {
  const settling = alpha > 0.02;
  if (settling) { simulate(alpha); alpha *= 0.99; }
  const easing = easeCam();
  draw();
  // Keep going while the layout is settling OR the camera is still moving.
  if (settling || easing) requestAnimationFrame(frame);
  else running = false;
}

function wake() {
  if (!running) { running = true; requestAnimationFrame(frame); }
}

// Redraw for interactions that change the view but not the layout (pan, zoom,
// selection). No-op while the simulation is already painting.
function render() { if (!running) draw(); }

// --- interaction ---------------------------------------------------------
let drag = null, moved = 0;

canvas.addEventListener('mousedown', e => {
  drag = { x: e.clientX - cam.x, y: e.clientY - cam.y };
  moved = 0;
});

window.addEventListener('mouseup', e => {
  // A click is a mouseup that did not travel. Without the distance check,
  // panning would select whichever node happened to be under the cursor when
  // the drag ended — which feels broken.
  if (drag && moved < 5) pick(e);
  drag = null;
});

window.addEventListener('mousemove', e => {
  if (!drag) return;
  moved += Math.abs(e.movementX || 0) + Math.abs(e.movementY || 0);
  cam.x = e.clientX - drag.x; cam.y = e.clientY - drag.y;
  render();                       // panning changes the view, not the layout
});

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  // Convert to canvas-relative coords first: the canvas is offset by the
  // sidebar, so raw clientX would zoom toward the wrong point.
  const rect = canvas.getBoundingClientRect();
  zoomAt(e.clientX - rect.left, e.clientY - rect.top, e.deltaY > 0 ? 0.92 : 1.08);
}, { passive: false });

// px/py are canvas-relative.
function zoomAt(px, py, factor) {
  const k2 = Math.min(4, Math.max(0.2, cam.k * factor));
  // Zoom toward the pointer, not the origin, so whatever you are looking at
  // stays under the cursor.
  cam.x = px - (px - cam.x) * (k2 / cam.k);
  cam.y = py - (py - cam.y) * (k2 / cam.k);
  cam.k = k2;
  render();
}

function toWorld(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: (clientX - rect.left - cam.x) / cam.k,
    y: (clientY - rect.top - cam.y) / cam.k,
  };
}

function pick(e) {
  const p = toWorld(e.clientX, e.clientY);
  let hit = null, best = Infinity;
  for (const n of nodes) {
    const d = Math.hypot(n.x - p.x, n.y - p.y);
    if (d <= n.r + 4 / cam.k && d < best) { best = d; hit = n; }
  }
  select(hit ? hit.id : null);
}

// The exit control is visible whenever anything is open, so there is always an
// obvious way back to the overview.
function syncExit() {
  const btn = document.getElementById('exit-zoom');
  if (btn) btn.hidden = !(expanded.size || selected);
}

function select(id) {
  // Clicking a visible node toggles its sub-nodes. That is the primary
  // interaction now; the inspector follows it.
  if (id && visibleIds.has(id)) {
    if (expanded.has(id)) {
      expanded.delete(id);
      fitTo(visibleNodes(), 110, 1.0);   // zoom back out
    } else {
      expanded.add(id);
      // Zoom IN to the node and its sub-nodes, so the new structure is framed.
      const focus = new Set([id, ...neighboursOf(id)]);
      fitTo(focus);
    }
  }
  selected = id;
  syncExit();
  const panel = document.getElementById('detail');
  if (id && byId[id]) {
    renderDetail(byId[id]);
    panel.classList.add('open');
  } else {
    panel.classList.remove('open');
  }
  syncExit();
  render();                       // repaint so the highlight follows the click
}

// --- node inspector ------------------------------------------------------
// The picture shows structure; the node holds the data. Clicking one reveals
// what it is, what properties it carries, and everything it connects to.
function renderDetail(node) {
  document.getElementById('d-kind').textContent = node.type || 'node';
  document.getElementById('d-label').textContent = node.label || node.id;

  const body = document.getElementById('d-body');
  body.innerHTML = '';

  // Properties are dropped from the offline fixture to keep it small, so this
  // section simply does not appear when they are absent.
  const props = node.properties && typeof node.properties === 'object'
    ? Object.entries(node.properties).filter(([, v]) => v !== null && v !== '')
    : [];
  if (props.length) {
    body.insertAdjacentHTML('beforeend', '<div class="sect">Properties</div>');
    const wrap = document.createElement('div');
    wrap.className = 'props';
    for (const [k, v] of props.slice(0, 14)) {
      const row = document.createElement('div');
      row.className = 'p';
      const kk = document.createElement('span'); kk.className = 'k'; kk.textContent = k;
      const vv = document.createElement('span'); vv.className = 'v';
      const full = typeof v === 'object' ? JSON.stringify(v) : String(v);
      // A TextSummary node carries its whole passage. Dumping 4KB into a side
      // panel makes the panel useless, so cap what is shown and keep the rest
      // available on hover.
      vv.textContent = full.length > 420 ? full.slice(0, 420) + '…' : full;
      vv.title = full;
      row.append(kk, vv);
      wrap.appendChild(row);
    }
    body.appendChild(wrap);
  }

  // Relationships, grouped by verb so "requires_approval → CFO" reads clearly.
  const links = [];
  for (const e of edges) {
    if (e.source === node.id) links.push({ verb: e.label, other: e.target, dir: '→' });
    else if (e.target === node.id) links.push({ verb: e.label, other: e.source, dir: '←' });
  }

  if (!links.length) {
    body.insertAdjacentHTML('beforeend',
      '<div class="sect">Connections</div><div class="hint">No relationships.</div>');
    return;
  }

  body.insertAdjacentHTML('beforeend',
    `<div class="sect">Connections (${links.length})</div>`);
  const list = document.createElement('div');
  list.className = 'rel';
  for (const l of links.slice(0, 60)) {
    const other = byId[l.other];
    const row = document.createElement('div');
    row.className = 'row';
    const arrow = document.createElement('span');
    arrow.className = 'arrow'; arrow.textContent = l.dir;
    const verb = document.createElement('span');
    verb.className = 'verb'; verb.textContent = l.verb || 'related';
    const who = document.createElement('span');
    who.className = 'who';
    who.textContent = other ? (other.label || other.id) : l.other;
    row.append(arrow, verb, who);
    // Clicking a relationship walks to that node — the graph becomes navigable
    // rather than something you can only look at.
    // M3: this used to set cam.x/cam.y directly after select(). select() calls
    // fitTo(), which sets camTarget, and the frame loop's easeCam() then lerps
    // cam toward it - so those assignments were discarded on the next frame.
    // select() already moves the camera; the manual set was dead code that
    // merely looked like it was doing the work.
    if (other) row.addEventListener('click', () => select(other.id));
    list.appendChild(row);
  }
  body.appendChild(list);
}

document.getElementById('detail-close').addEventListener('click', () => select(null));
document.addEventListener('keydown', e => { if (e.key === 'Escape') select(null); });

document.getElementById('z-in').addEventListener('click', () =>
  zoomAt(W / 2, H / 2, 1.25));
document.getElementById('z-out').addEventListener('click', () =>
  zoomAt(W / 2, H / 2, 0.8));
document.getElementById('exit-zoom').addEventListener('click', collapseAll);
document.getElementById('x-all').addEventListener('click', expandAll);
document.getElementById('x-none').addEventListener('click', collapseAll);
document.getElementById('z-fit').addEventListener('click', () => {
  cam = { x: 0, y: 0, k: 1 };
  alpha = 1;                       // re-run the layout from the start
  wake();                          // and restart the render loop for it
});

// --- load ----------------------------------------------------------------
// `?brain=<name>` scopes the view to an uploaded brain; absent = demo brain.
// `dataset=` is accepted too so a URL copied from the API still works.
const _p = new URLSearchParams(location.search);
const BRAIN = _p.get('brain') || _p.get('dataset') || '';
const GRAPH_URL = '/api/graph' + (BRAIN ? '?dataset=' + encodeURIComponent(BRAIN) : '');

if (BRAIN) {
  document.getElementById('title').textContent = BRAIN;
  document.getElementById('subtitle').textContent =
    'Entities and relationships extracted from the documents you uploaded.';
}

fetch(GRAPH_URL).then(r => r.json()).then(g => {
  if (g.error) throw new Error(g.error);
  const rawNodes = g.nodes || [];
  const rawEdges = g.edges || [];

  if (!rawNodes.length) {
    // "Run python ingest.py" is only the right advice for the demo brain.
    document.body.insertAdjacentHTML('beforeend', BRAIN
      ? '<div class="err">This brain has no graph yet. Ingestion may still be '
        + 'running — check <a href="/brains">brains</a>.</div>'
      : '<div class="err">The graph is empty. Run <code>python ingest.py</code> first.</div>');
    return;
  }

  nodes = rawNodes.map((n, i) => {
    const type = n.type || 'Node';
    const label = (n.label || n.id || '').replace(/^([A-Za-z]+)_[0-9a-f-]{8,}$/, '$1');
    return {
      id: n.id,
      type,
      label,
      // Keep properties: the node inspector is the whole point of clicking a
      // node, and dropping them here meant the panel could never show any.
      properties: n.properties || null,
      r: 4 + Math.min(7, (label.length || 0) / 8),
      x: W / 2 + Math.cos(i * 2.399) * (60 + Math.random() * 220),
      y: H / 2 + Math.sin(i * 2.399) * (60 + Math.random() * 220),
      vx: 0, vy: 0
    };
  });
  byId = Object.fromEntries(nodes.map(n => [n.id, n]));

  const ids = new Set(nodes.map(n => n.id));
  edges = rawEdges
    .map(e => ({
      source: e.source ?? e.from ?? e.start,
      target: e.target ?? e.to ?? e.end,
      // Keep the relationship verb. The graph carries typed edges
      // (requires_approval, escalates_to, service_credit_cap ...) and dropping
      // the label made every connection in the inspector read "related".
      label: e.label ?? e.type ?? e.rel ?? null,
    }))
    .filter(e => ids.has(e.source) && ids.has(e.target));

  const types = {};
  nodes.forEach(n => types[n.type] = (types[n.type] || 0) + 1);

  // C2: this used to interpolate the node type into innerHTML. A type is graph
  // data, and an uploaded brain's graph is built from user documents - so a
  // crafted document could execute script here. Verified exploitable. Every
  // value below goes in via textContent or a property assignment instead.
  const legend = document.getElementById('legend');
  legend.textContent = '';
  Object.entries(types)
    .sort((a, b) => b[1] - a[1])
    .forEach(([type, count]) => {
      const row = document.createElement('div');
      const swatch = document.createElement('span');
      swatch.className = 'swatch';
      swatch.style.background = colorFor(type);   // not a string-interpolated style
      const label = document.createElement('span');
      label.textContent = type;
      const num = document.createElement('b');
      num.textContent = count;
      row.append(swatch, label, document.createTextNode(' '), num);
      legend.appendChild(row);
    });

  // Core nodes = the most connected ones. They are what the graph opens with;
  // everything else is one click away.
  ROOTS = [...nodes]
    .map(nd => ({ id: nd.id, deg: neighboursOf(nd.id).size - 1 }))
    .sort((a, b) => b.deg - a.deg)
    .slice(0, 12)
    .map(x => x.id);

  document.getElementById('panel').innerHTML =
    `<span><b>${nodes.length}</b> nodes</span>` +
    `<span><b>${edges.length}</b> edges</span>` +
    `<span>click a node to open its sub-nodes</span>` +
    `<span>scroll to zoom · drag to pan</span>`;

  wake();
}).catch(err => {
  // Same rule as the legend: an error message is text, not markup.
  const box = document.createElement('div');
  box.className = 'err';
  box.textContent = 'Could not load the graph: ' + (err && err.message ? err.message : 'unknown error');
  document.body.appendChild(box);
});
</script>
<script src="/static/shell.js"></script>
</body>
</html>
