# Render Blueprint — defines BOTH services.
#
# There is NO CLI deploy command for Blueprints. `render blueprints` supports
# only `validate` (verified against CLI v2.28.0). Deploy by connecting this repo
# in the Render dashboard, which reads this file.
#
# Why two services: Render task runs cannot accept inbound connections (no ports),
# so the workflow service can never serve the UI.
#
# Note: the web service does NOT trigger workflow runs. It talks to the Cognee
# Cloud tenant directly, so uploads take no retry from the workflow tier.
# `ignite-wf` is the parallel-ingest path used by ingest.py.
#
# Why there is no LLM key and no database password below: the Cognee Cloud tenant
# instance owns the model, the embeddings, the vector store and the graph. Every
# ephemeral task container needs exactly one credential — the API key.
#
# `sync: false` means Render prompts for the value instead of storing it in git.

services:
  - type: web
    name: ignite-web
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    healthCheckPath: /health
    envVars:
      - key: PROVIDER
        value: cloud
      - key: COGNEE_SERVICE_URL
        sync: false
      - key: COGNEE_API_KEY
        sync: false
      - key: COGNEE_DATASET
        value: company_brain
      # Render requires a web service to bind 0.0.0.0 to receive public traffic,
      # and forwards to $PORT (default 10000). app.py defaults HOST to
      # 127.0.0.1 for local use, so without this line the service starts, passes
      # its own health check over loopback, and is unreachable from the internet
      # — a confusing first-deploy failure. Do not remove.
      - key: HOST
        value: 0.0.0.0

  - type: workflow
    name: ignite-wf
    runtime: python
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: python pipeline.py
    envVars:
      - key: PROVIDER
        value: cloud
      - key: COGNEE_SERVICE_URL
        sync: false
      - key: COGNEE_API_KEY
        sync: false
      - key: COGNEE_DATASET
        value: company_brain
      # If a self-hosted Cognee is ever preferred over the cloud tenant, the
      # graph store must outlive the container. A file-based backend such as
      # "ladybug" does NOT survive a task run — that is the whole reason the
      # cloud path exists.
      # - key: GRAPH_DATABASE_PROVIDER
      #   value: neo4j
      # - key: GRAPH_DATABASE_URL
      #   sync: false
      # - key: GRAPH_DATABASE_USERNAME
      #   sync: false
      # - key: GRAPH_DATABASE_PASSWORD
      #   sync: false
